<!doctype html>
<html>
  <head>
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="line"></div>
    <div class="line2"></div>
    <div class="todo-box">
      <h2>Todo List</h2>
      <div class="input-section">
        <input id="todo-input" type="text" placeholder="Enter a todo" />
        <button id="add-button" onclick="addTodo()">Add</button>
      </div>
      <ul id="todoList"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
